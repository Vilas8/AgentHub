name: AgentHub CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Test & Security Suite
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: test_super_secret_jwt_key_must_be_over_32_characters_long_for_security
      CSRF_SECRET_KEY: test_super_secret_csrf_key_must_be_over_32_characters_long_for_security
      ENVIRONMENT: test
      PAYMENT_PROVIDER: simulator
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Ruff Checks
        working-directory: apps/api
        run: |
          ruff check app tests

      - name: Run Mypy Typecheck
        working-directory: apps/api
        run: |
          mypy app

      - name: Run Pytest Suite
        working-directory: apps/api
        run: |
          pytest -v --tb=short

  frontend-check:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install npm dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run ESLint
        working-directory: apps/web
        run: npm run lint

      - name: Run TypeScript Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit
